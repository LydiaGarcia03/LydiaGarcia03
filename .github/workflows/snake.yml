# Draws a snake eating the contribution graph and publishes it on the
# "output" branch, where the README reads it. Runs every day (free on public repos).
name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3178c6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5c9ce6

      # snk runs in a Docker container as root, so its files in dist/ belong to root.
      - name: Hide the progress bar under the grid
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          node .github/scripts/hide-progress-bar.mjs dist/github-snake.svg dist/github-snake-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
